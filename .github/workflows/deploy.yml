name: Deploy to VPS

on:
  push:
    branches:
      - main
      - test

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy production
        if: github.ref_name == 'main'
        env:
          DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}
          TARGET_DIRECTORY: ${{ secrets.TARGET_PRODUCTION_DIRECTORY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "\"${DEPLOY_SCRIPT_PATH}\" main \"${TARGET_DIRECTORY}\" && pm2 restart adserver-backend-production && pm2 restart adserver-frontend-production && pm2 save"

      - name: Deploy staging
        if: github.ref_name == 'test'
        env:
          DEPLOY_SCRIPT_PATH: ${{ vars.DEPLOY_SCRIPT_PATH }}
          TARGET_DIRECTORY: ${{ secrets.TARGET_TESTING_DIRECTORY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "\"${DEPLOY_SCRIPT_PATH}\" test \"${TARGET_DIRECTORY}\" && pm2 restart adserver-backend-staging && pm2 restart adserver-frontend-staging && pm2 save"
