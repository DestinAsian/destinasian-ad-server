name: Deploy to VPS

on:
  push:
    branches:
      - main
      - test

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug loaded SSH keys
        run: |
          ssh-add -L || true

      - name: Debug PM2 context
        run: |
          ssh -o BatchMode=yes -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
          "whoami && echo \$HOME && pm2 list || true"

      - name: Deploy main to production
        if: github.ref_name == 'main'
        run: |
          ssh -o BatchMode=yes -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            whoami
            echo "$HOME"
            /srv/apps/scripts/deploy-adserver.sh main /srv/apps/production/destinasian-ad-server
            pm2 list
          EOF

      - name: Deploy test to staging
        if: github.ref_name == 'test'
        run: |
          ssh -o BatchMode=yes -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
            whoami
            echo "$HOME"
            /srv/apps/scripts/deploy-adserver.sh test /srv/apps/staging/destinasian-ad-server
            pm2 list
          EOF
